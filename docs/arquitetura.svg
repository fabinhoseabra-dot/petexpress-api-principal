<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="720"
     viewBox="0 0 1200 720">

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feDropShadow dx="0"
                    dy="4"
                    stdDeviation="5"
                    flood-color="#000000"
                    flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200"
        height="720"
        fill="#f8fafc"/>

  <!-- Título -->
  <text x="600"
        y="55"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#0f172a">
    Arquitetura PetExpress
  </text>

  <text x="600"
        y="85"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#64748b">
    Arquitetura baseada no Cenário 2.1
  </text>

  <!-- API Principal -->
  <rect x="80"
        y="245"
        width="280"
        height="180"
        rx="16"
        fill="#dbeafe"
        stroke="#2563eb"
        stroke-width="3"
        filter="url(#shadow)"/>

  <text x="220"
        y="285"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a8a">
    API Principal
  </text>

  <text x="220"
        y="318"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#1e40af">
    Gestão de Pedidos
  </text>

  <text x="220"
        y="350"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Python + FastAPI
  </text>

  <text x="220"
        y="378"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Porta 8000
  </text>

  <text x="220"
        y="405"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#475569">
    CRUD + filtro por status
  </text>

  <!-- API Logística -->
  <rect x="460"
        y="245"
        width="280"
        height="180"
        rx="16"
        fill="#dcfce7"
        stroke="#16a34a"
        stroke-width="3"
        filter="url(#shadow)"/>

  <text x="600"
        y="285"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#14532d">
    API Logística
  </text>

  <text x="600"
        y="318"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#166534">
    Validação e Logística
  </text>

  <text x="600"
        y="350"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Python + FastAPI
  </text>

  <text x="600"
        y="378"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Porta 8001
  </text>

  <text x="600"
        y="405"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#475569">
    CEP + região + frete + prazo
  </text>

  <!-- ViaCEP -->
  <rect x="840"
        y="245"
        width="280"
        height="180"
        rx="16"
        fill="#fef3c7"
        stroke="#d97706"
        stroke-width="3"
        filter="url(#shadow)"/>

  <text x="980"
        y="290"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#92400e">
    ViaCEP
  </text>

  <text x="980"
        y="325"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#92400e">
    API Externa
  </text>

  <text x="980"
        y="360"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Consulta de CEP
  </text>

  <text x="980"
        y="390"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#334155">
    Serviço público e gratuito
  </text>

  <!-- Seta Principal -> Logística -->
  <line x1="360"
        y1="335"
        x2="450"
        y2="335"
        stroke="#334155"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="405"
        y="310"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="bold"
        fill="#475569">
    REST / JSON
  </text>

  <!-- Seta Logística -> ViaCEP -->
  <line x1="740"
        y1="335"
        x2="830"
        y2="335"
        stroke="#334155"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="785"
        y="310"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="bold"
        fill="#475569">
    HTTP / REST
  </text>

  <!-- Banco SQLite -->
  <ellipse cx="220"
           cy="560"
           rx="105"
           ry="28"
           fill="#ede9fe"
           stroke="#7c3aed"
           stroke-width="3"/>

  <rect x="115"
        y="525"
        width="210"
        height="70"
        fill="#ede9fe"
        stroke="#7c3aed"
        stroke-width="3"/>

  <ellipse cx="220"
           cy="525"
           rx="105"
           ry="28"
           fill="#f5f3ff"
           stroke="#7c3aed"
           stroke-width="3"/>

  <ellipse cx="220"
           cy="595"
           rx="105"
           ry="28"
           fill="#ede9fe"
           stroke="#7c3aed"
           stroke-width="3"/>

  <text x="220"
        y="555"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="#5b21b6">
    SQLite
  </text>

  <text x="220"
        y="580"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#5b21b6">
    Persistência de Pedidos
  </text>

  <!-- Seta API Principal -> SQLite -->
  <line x1="220"
        y1="425"
        x2="220"
        y2="490"
        stroke="#334155"
        stroke-width="3"
        marker-end="url(#arrow)"/>

  <text x="285"
        y="465"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="bold"
        fill="#475569">
    SQLAlchemy
  </text>

  <!-- Docker Compose -->
  <rect x="425"
        y="525"
        width="350"
        height="100"
        rx="14"
        fill="#e0f2fe"
        stroke="#0284c7"
        stroke-width="2"
        stroke-dasharray="8 5"/>

  <text x="600"
        y="562"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#075985">
    Docker Compose
  </text>

  <text x="600"
        y="590"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#0c4a6e">
    Orquestra API Principal + API Logística
  </text>

  <!-- Legenda inferior -->
  <text x="600"
        y="675"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#64748b">
    PetExpress - Gestão integrada de pedidos e logística para petshops
  </text>

</svg>